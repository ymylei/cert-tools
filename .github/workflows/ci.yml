name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
        go-version: 'stable'
    
    - name: Install tools
      run: make tools

    - name: Check Code
      run: make check

    - name: Build
      run: make build

    - name: Test
      run: make test